"use strict";
const W=1920,H=1080;

const DPR=Math.min(devicePixelRatio||1,2);

const AMBER='#ffb000',AMBERD='#8a6400',TEAL='#4fe3c1',TEALD='#1f6a58',RED='#ff3838',WHITE='#eceae4',GRAY='#7d7d7d',GRAY2='#4a4a4e',BG='#060607';
const MONO=(s,w)=>(w||400)+' '+s+'px "SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const SERIF=(s,w)=>(w||400)+' '+s+'px Georgia,"Times New Roman",serif';
function txt(s,x,y,font,color,align){g.font=font;g.fillStyle=color;g.textAlign=align||'left';g.textBaseline='alphabetic';g.fillText(s,x,y);}
function clamp(x,a,b){return x<a?a:x>b?b:x}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1)}
function ease(x){x=clamp(x,0,1);return x*x*(3-2*x)}
function eo(x){x=clamp(x,0,1);return 1-Math.pow(1-x,3)}
function ei(x){x=clamp(x,0,1);return x*x*x}
function blink(t,hz){return ((t*hz)%1)<0.6?1:0.18}
function line(x1,y1,x2,y2,color,w){g.strokeStyle=color;g.lineWidth=w||1.4;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function circle(x,y,r,color,w,fill){g.beginPath();g.arc(x,y,r,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill();}else{g.strokeStyle=color;g.lineWidth=w||1.4;g.stroke();}}
function frame(x,y,w,h,label,kanji,color){
 color=color||AMBER;const c=16;g.lineWidth=1.6;g.strokeStyle=color;g.globalAlpha=.95;g.beginPath();
 g.moveTo(x,y+c);g.lineTo(x,y);g.lineTo(x+c,y);g.moveTo(x+w-c,y);g.lineTo(x+w,y);g.lineTo(x+w,y+c);
 g.moveTo(x+w,y+h-c);g.lineTo(x+w,y+h);g.lineTo(x+w-c,y+h);g.moveTo(x+c,y+h);g.lineTo(x,y+h);g.lineTo(x,y+h-c);g.stroke();
 g.globalAlpha=.13;g.strokeRect(x+.5,y+.5,w-1,h-1);g.globalAlpha=1;
 if(label)txt(label,x+16,y+26,MONO(15,700),color);
 if(kanji)txt(kanji,x+w-16,y+30,MONO(24,600),color,'right');
}
function arrow(x1,y1,x2,y2,color,w,p){ // p = how much of the arrow is drawn 0..1
 color=color||AMBER;const dx=x2-x1,dy=y2-y1,ex=x1+dx*clamp(p==null?1:p,0,1),ey=y1+dy*clamp(p==null?1:p,0,1);
 line(x1,y1,ex,ey,color,w||2);
 if(p==null||p>=1){const a=Math.atan2(dy,dx),s=12;g.fillStyle=color;g.beginPath();g.moveTo(ex,ey);g.lineTo(ex-s*Math.cos(a-.45),ey-s*Math.sin(a-.45));g.lineTo(ex-s*Math.cos(a+.45),ey-s*Math.sin(a+.45));g.closePath();g.fill();}
}
const noise=document.createElement('canvas');noise.width=noise.height=128;
{const nx=noise.getContext('2d');const id=nx.createImageData(128,128);for(let i=0;i<id.data.length;i+=4){const v=(Math.random()*255)|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}nx.putImageData(id,0,0);}
const TOTAL=0;
function fmtT(s){s=Math.max(0,s|0);return String((s/60)|0)+':'+String(s%60).padStart(2,'0')}
let DUR=0;
function chrome(sc,idx,st,gt){
 const vg=g.createRadialGradient(W/2,H/2,H*.42,W/2,H/2,H*1.0);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=vg;g.fillRect(0,0,W,H);
 g.globalAlpha=.045;g.fillStyle='#000';for(let y=0;y<H;y+=4)g.fillRect(0,y,W,1);g.globalAlpha=1;
 g.globalAlpha=.026;const ox=(Math.random()*128)|0,oy=(Math.random()*128)|0;
 for(let y=-oy;y<H;y+=128)for(let x=-ox;x<W;x+=128)g.drawImage(noise,x,y);
 g.globalAlpha=1;
 if(sc.type!=='title'&&sc.type!=='end'){
  txt(sc.kanji,80,102,MONO(34,600),AMBER);

  txt(sc.code+'  ·  '+sc.tag,190,98,MONO(17,700),AMBER);
  line(80,118,430,118,AMBERD,1);
 }
 // top-right status
 const tc=fmtT(elapsed())+' / '+fmtT(DUR);
 txt(playing?'▶ RUN':'❚❚ HOLD',W-80,86,MONO(16,700),playing?TEAL:AMBER,'right');
 txt(tc,W-80,110,MONO(15,400),GRAY,'right');
 // caption
 if(sc.cap){txt(sc.cap,W/2,H-72,SERIF(30,400),WHITE,'center');}

 g.globalAlpha=1;
 txt('SCENE '+String(idx+1).padStart(2,'0')+' / '+String(SCENES.length).padStart(2,'0'),W-80,H-52,MONO(13,600),GRAY,'right');
 // cut flash
 if(st<0.14&&idx>0){g.globalAlpha=.22*(1-st/0.14);g.drawImage(noise,0,0,W,H);g.globalAlpha=1;}
}
function hintOverlay(gt){
 if(gt>4.5)return;const a=1-seg(gt,3.4,4.5);g.globalAlpha=a*.9;
 txt('AUTOPLAY ON — SPACE pause · ← → scenes · R replay',W/2,H-130,MONO(15,600),GRAY,'center');g.globalAlpha=1;
}
let playing=true,si=0,st=0,gt=0,startAt=performance.now();
function elapsed(){let e=0;for(let i=0;i<si;i++)e+=SCENES[i].dur;return e+Math.min(st,SCENES[si].dur);}
function draw(){
 g.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 g.fillStyle=BG;g.fillRect(0,0,W,H);
 const sc=SCENES[si];
 sc.draw(st,gt);
 chrome(sc,si,st,gt);
 hintOverlay(gt);
 if(!playing&&si===SCENES.length-1&&st>=SCENES[si].dur-0.01){
  if(blink(gt,1.4)>.5)txt('— REPLAY : PRESS R —',W/2,H-180,MONO(20,700),AMBER,'center');
 }
}
let last=performance.now();
function loop(now){const dt=Math.min(.06,(now-last)/1000);last=now;gt+=dt;
 if(playing){st+=dt;while(si<SCENES.length-1&&st>=SCENES[si].dur){st-=SCENES[si].dur;si++;}
  if(si===SCENES.length-1&&st>=SCENES[si].dur){st=SCENES[si].dur;playing=false;}}
 draw();requestAnimationFrame(loop);}
function go(n){si=clamp(n,0,SCENES.length-1);st=0;playing=true;}
addEventListener('keydown',e=>{
 if(e.code==='Space'){playing=!playing;e.preventDefault();}
 else if(e.key==='ArrowRight')go(si+1);
 else if(e.key==='ArrowLeft')go(si-1);
 else if(e.key==='r'||e.key==='R')go(0);
});
cv.addEventListener('pointerdown',e=>{
 const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(y>r.height*0.8&&x<r.width*0.18){go(si-1);return;}
 if(y>r.height*0.8&&x>r.width*0.82){go(si+1);return;}
 playing=!playing;
});
